<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>Denerf Studio - AI-Augmented MVP Development</title>
    <meta name="description"
        content="We transform ideas into MVPs in record time. Expert full-stack development, AI-augmented engineering, and product management.">
    <meta name="keywords"
        content="MVP development, AI coding, software development, full stack, React, Node.js, rapid prototyping">
    <meta name="author" content="Denerf Studio">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Denerf Studio - AI-Augmented MVP Development">
    <meta property="og:description" content="We transform ideas into MVPs in record time.">
    <meta property="og:url" content="https://denerf.studio">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/main.css">
</head>

<body class="bg-white dark:bg-[#050810] text-gray-900 dark:text-white">
    <canvas id="canvas"></canvas>
    <!-- Navigation with Mobile Menu -->
    <nav class="fixed top-0 left-0 w-full z-50 px-6 py-6 flex justify-between items-center mix-blend-difference">
        <a href="/"
            class="text-2xl font-bold tracking-tighter font-mono text-gray-900 dark:text-white reveal-text nav-item">
            Denerf<span class="text-cyan-400">_</span>
        </a>

        <!-- Desktop Menu -->
        <div class="hidden md:flex gap-8 text-sm font-medium text-gray-800 dark:text-zinc-300 font-mono">
            <a href="/work" class="hover:text-cyan-400 transition-colors reveal-text nav-item">WORK</a>
            <a href="/services" class="hover:text-cyan-400 transition-colors reveal-text nav-item">SERVICES</a>
            <a href="/about" class="hover:text-cyan-400 transition-colors reveal-text nav-item">ABOUT</a>
            <a href="/#contact" class="hover:text-cyan-400 transition-colors reveal-text nav-item">CONTACT</a>
            <button onclick="toggleTheme()"
                class="theme-toggle-btn hover:text-cyan-400 transition-colors nav-item ml-4">
                <i data-lucide="moon" width="20" height="20"></i>
            </button>
        </div>

        <!-- Mobile Controls -->
        <div class="md:hidden flex items-center gap-4">
            <button onclick="toggleTheme()" class="theme-toggle-btn text-gray-900 dark:text-white nav-item">
                <i data-lucide="moon" width="20" height="20"></i>
            </button>
            <button id="mobile-menu-btn" class="text-gray-900 dark:text-white reveal-text nav-item">
                <i data-lucide="menu" width="24" height="24"></i>
            </button>
        </div>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu"
        class="fixed inset-0 bg-black/95 backdrop-blur-lg z-[100] translate-x-full transition-transform duration-300 md:hidden">
        <div class="flex flex-col h-full">
            <div class="flex justify-between items-center px-6 py-6">
                <a href="/" class="text-2xl font-bold tracking-tighter font-mono text-white">
                    Denerf<span class="text-cyan-400">_</span>
                </a>
                <button id="mobile-menu-close" class="text-white">
                    <i data-lucide="x" width="32" height="32"></i>
                </button>
            </div>

            <div
                class="flex flex-col items-center justify-center flex-1 gap-8 text-2xl font-medium text-zinc-300 font-mono">
                <a href="/" class="hover:text-cyan-400 transition-colors">HOME</a>
                <a href="/work" class="hover:text-cyan-400 transition-colors">WORK</a>
                <a href="/services" class="hover:text-cyan-400 transition-colors">SERVICES</a>
                <a href="/about" class="hover:text-cyan-400 transition-colors">ABOUT</a>
                <a href="/#contact" class="hover:text-cyan-400 transition-colors">CONTACT</a>
            </div>

            <div class="px-6 py-8 border-t border-zinc-800">
                <div class="flex justify-center gap-6 text-sm font-mono text-zinc-400">
                    <a href="#" class="hover:text-white">GITHUB</a>
                    <a href="#" class="hover:text-white">LINKEDIN</a>
                    <a href="#" class="hover:text-white">TWITTER</a>
                </div>
            </div>
        </div>
    </div>
