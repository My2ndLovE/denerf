<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Quantum symbol -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad)" stroke-width="3"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="url(#grad)" stroke-width="2"/>
  <circle cx="50" cy="50" r="10" fill="url(#grad)"/>

  <!-- Orbital paths -->
  <ellipse cx="50" cy="50" rx="35" ry="15" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="50" cy="50" rx="15" ry="35" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
</svg>
